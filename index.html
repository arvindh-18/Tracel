    <!-- Sets data-theme before first paint so there is no flash of the wrong theme. -->
    <script>(function(){var t='system';try{t=localStorage.getItem('tracel:theme')||'system'}catch(e){}if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t})();</script>
